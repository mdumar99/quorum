# Alembic configuration (ADR-0002, Decision 1). Run from apps/api: `uv run alembic upgrade head`.
#
# No database URL here: migrations/env.py reads OWNER_DATABASE_URL from the environment, so the
# owner's credentials never live in a file and never in the API's Settings.

[alembic]
script_location = %(here)s/migrations

# Hand-written, forward-only revisions. No autogenerate.
# Revisions have sequential ids: 0001_baseline.py, 0002_<slug>.py, and so on. Create one with
#   uv run alembic revision --rev-id 0002 -m <slug>
# because Alembic otherwise generates a random hex id.
file_template = %%(rev)s_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
