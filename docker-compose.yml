# Full Phase 0 stack: postgres, redis, api, web.
# `docker compose up` from a clean clone (after `cp .env.example .env`) brings all four up healthy.
services:
  postgres:
    image: postgres:17.11-alpine       # exact minor (ADR-0002); keep in step with ci.yml
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # localhost only; host port configurable
    volumes:
      - postgres-data:/var/lib/postgresql/data          # survives `down`; wiped by `down -v`
    healthcheck:
      # $$ escapes Compose's own ${} substitution; expanded inside the container instead
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the two application roles and their grants (ADR-0002), then exits 0.
  # Idempotent, so it is safe on a fresh volume and on an existing one.
  bootstrap:
    image: postgres:17.11-alpine       # same pin as the postgres service; only psql is used
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects over the compose network (TCP), where the password IS checked.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      QUORUM_OWNER_PASSWORD: ${QUORUM_OWNER_PASSWORD:?set it in .env}
      QUORUM_APP_PASSWORD: ${QUORUM_APP_PASSWORD:?set it in .env}
    volumes:
      - ./db/bootstrap.sql:/bootstrap.sql:ro
    # The postgres image declares a volume at its data directory. This service never uses it,
    # and a tmpfs mount there stops Docker creating an anonymous volume for the container.
    tmpfs:
      - /var/lib/postgresql/data
    entrypoint:
      - sh
      - -c
      - |
        # The postgres healthcheck passes on the local socket, which can be before TCP is open
        # during first initialisation, so wait for TCP here.
        i=0
        until pg_isready -q; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then echo "postgres is not reachable over TCP" >&2; exit 1; fi
          sleep 1
        done
        exec psql -X -v ON_ERROR_STOP=1 -v dbname="$$PGDATABASE" -f /bootstrap.sql

  api:
    build: ./apps/api
    environment:
      # Service names + INTERNAL port 5432 (not POSTGRES_HOST_PORT). See README → Setup.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy     # wait for real readiness, not just "container started"
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully   # roles exist before the API starts
    healthcheck:
      # No curl in python:3.13-slim. urlopen raises on a 503, so the container reports
      # unhealthy if a dependency is down (readiness, not just "process alive").
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000         # server-side only; the browser never sees this address
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # No curl in node:alpine; busybox wget is built in.
      # 127.0.0.1, not "localhost": on Alpine, localhost can resolve to IPv6 (::1),
      # where the server isn't listening.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
