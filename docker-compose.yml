# Phase 0 (P0-3): datastores only. The API runs natively via uv for now;
# P0-2 adds the api + web services to this same file.
services:
  postgres:
    image: postgres:17-alpine          # pin the major version; "latest" can change under you
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          # values come from .env (Compose reads it automatically)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"         # localhost only: not exposed to your Wi-Fi/LAN
    healthcheck:
      # $$ escapes Compose's own ${} substitution, so the variable is
      # expanded inside the container at check time instead
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
